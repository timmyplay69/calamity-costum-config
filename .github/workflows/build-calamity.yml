name: Build Calamity Spacewar (USB ACM + Ext WiFi)
on: [push, workflow_dispatch]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Persiapan Dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio curl device-tree-compiler flex git libelf-dev libncurses5-dev libssl-dev lld llvm clang lz4 python3 python-is-python3 rsync unzip wget xz-utils zip zstd gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: 2. Download Toolchain Clang
        run: |
          mkdir -p "$HOME/clang"
          CLANG_URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | grep "browser_download_url.*tar.gz" | cut -d '"' -f 4 | head -n 1)
          if [ -n "$CLANG_URL" ]; then
            wget -q "$CLANG_URL" -O clang.tar.gz
            tar -xzf clang.tar.gz -C "$HOME/clang"
            rm -f clang.tar.gz
          fi

      - name: 3. Clone Source CalamityKernel-spacewar (With Auth Token)
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          git clone --depth=1 --recurse-submodules https://github.com/BruxinCore/CalamityKernel-spacewar.git kernel
          cd kernel
          git submodule update --init --recursive || true

      - name: 4. Deteksi Defconfig dan Tambah Modul Baru
        id: inject
        working-directory: kernel
        run: |
          set -e
          DETECTED_DEFCONFIG=""
          for f in $(find . -maxdepth 3 \( -name "*.sh" -o -path "./.github/workflows/*.yml" -o -name "build.config*" \) 2>/dev/null); do
            match=$(grep -oE "(vendor/)?[a-zA-Z0-9_-]+_defconfig" "$f" | head -n 1 || true)
            if [ -n "$match" ] && [ -f "arch/arm64/configs/$match" ]; then
              DETECTED_DEFCONFIG="$match"
              break
            fi
          done
          if [ -z "$DETECTED_DEFCONFIG" ]; then
            for candidate in "vendor/spacewar_defconfig" "spacewar_defconfig" "vendor/calamity_defconfig" "calamity_defconfig" "vendor/yupik-perf_defconfig" "vendor/lahaina-qgki_defconfig" "lahaina-qgki_defconfig"; do
              if [ -f "arch/arm64/configs/$candidate" ]; then
                DETECTED_DEFCONFIG="$candidate"
                break
              fi
            done
          fi
          if [ -z "$DETECTED_DEFCONFIG" ]; then
            echo "Defconfig tidak ditemukan!"
            exit 1
          fi
          DEFCONFIG_PATH="arch/arm64/configs/$DETECTED_DEFCONFIG"
          echo "defconfig=$DETECTED_DEFCONFIG" >> $GITHUB_OUTPUT
          add_missing_module() {
            local cfg="$1"
            local file="$2"
            if grep -qE "^${cfg}=(y\vert{}m)" "$file"; then
              echo "[SKIP] $cfg sudah aktif, tidak diubah."
            elif grep -qE "^# ${cfg} is not set" "$file"; then
              sed -i "s|^# ${cfg} is not set|${cfg}=y\vert{}g" "$file"
              echo "[ENABLED] $cfg diaktifkan."
            else
              echo "${cfg}=y" >> "$file"
              echo "[ADDED] $cfg ditambahkan."
            fi
          }
          MODULES_TO_ADD=(
            "CONFIG_USB_ACM"
            "CONFIG_USB_SERIAL"
            "CONFIG_USB_SERIAL_GENERIC"
            "CONFIG_USB_SERIAL_CH341"
            "CONFIG_USB_SERIAL_CP210X"
            "CONFIG_USB_SERIAL_FTDI_SIO"
            "CONFIG_USB_SERIAL_PL2303"
            "CONFIG_USB_NET_DRIVERS"
            "CONFIG_USB_RTL8152"
            "CONFIG_USB_USBNET"
            "CONFIG_USB_NET_CDCETHER"
            "CONFIG_USB_NET_CDC_NCM"
            "CONFIG_USB_NET_RNDIS_HOST"
            "CONFIG_WLAN"
            "CONFIG_WIRELESS"
            "CONFIG_CFG80211"
            "CONFIG_CFG80211_WEXT"
            "CONFIG_MAC80211"
            "CONFIG_MAC80211_HAS_RC"
            "CONFIG_MAC80211_RC_MINSTREL"
            "CONFIG_MAC80211_RC_DEFAULT_MINSTREL"
            "CONFIG_MAC80211_MESH"
            "CONFIG_WLAN_VENDOR_ATH"
            "CONFIG_ATH_COMMON"
            "CONFIG_ATH_CARDS"
            "CONFIG_ATH9K_HW"
            "CONFIG_ATH9K_COMMON"
            "CONFIG_ATH9K_HTC"
            "CONFIG_CARL9170"
            "CONFIG_ATH10K"
            "CONFIG_ATH10K_USB"
            "CONFIG_WLAN_VENDOR_RALINK"
            "CONFIG_RT2X00"
            "CONFIG_RT2500USB"
            "CONFIG_RT73USB"
            "CONFIG_RT2800USB"
            "CONFIG_RT2800USB_RT
            
